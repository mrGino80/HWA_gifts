<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Wars Alliance – Portal to Discord</title>

  <!-- Auto redirect after 3 seconds -->
  <meta http-equiv="refresh" content="3; url=https://discord.gg/p6S2aabXV">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #f0e6d2;
      text-align: center;
      background: #0a0a0f;
      overflow: hidden;
    }

    /* Animated magical background */
    .bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(80, 60, 20, 0.4), #0a0a0f 70%);
      animation: pulse 6s infinite alternate;
      z-index: -1;
    }

    @keyframes pulse {
      0% { filter: brightness(0.8); }
      100% { filter: brightness(1.1); }
    }

    /* Fantasy frame */
    .frame {
      margin: 80px auto;
      padding: 40px;
      width: 80%;
      max-width: 600px;
      border: 3px solid #c9a34e;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(201, 163, 78, 0.7);
      background: rgba(20, 15, 5, 0.7);
    }

    .logo {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #f7d75c;
      text-shadow: 0 0 12px rgba(247, 215, 92, 0.9);
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 22px;
      color: #e8dcb3;
      margin-bottom: 40px;
    }

    /* Magical button */
    .btn {
      display: inline-block;
      padding: 16px 32px;
      background: linear-gradient(135deg, #f7d75c, #c9a34e);
      color: #1b1b29;
      font-weight: bold;
      border-radius: 10px;
      text-decoration: none;
      font-size: 20px;
      box-shadow: 0 0 15px rgba(247, 215, 92, 0.9);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px rgba(247, 215, 92, 1);
    }

    .footer {
      margin-top: 40px;
      font-size: 16px;
      color: #b8a57a;
    }

    /* Decorative runes */
    .runes {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 18px;
      letter-spacing: 10px;
      color: rgba(247, 215, 92, 0.3);
      text-shadow: 0 0 8px rgba(247, 215, 92, 0.4);
      user-select: none;
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="frame">
    <div class="logo">HERO WARS ALLIANCE</div>
    <div class="subtitle">A portal is opening… preparing your entry into our Discord realm.</div>

    <a class="btn" href="https://discord.gg/p6S2aabXV">
      Enter the Portal
    </a>

    <div class="footer">
      Auto‑redirect in 3 seconds
    </div>
  </div>

  <div class="runes">ᚠᛃᚱᚨᛚᛁᛖᚾᚲᛋ</div>
</body>
</html>
