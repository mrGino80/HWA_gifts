<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Wars Alliance – Discord Redirect</title>

  <!-- Redirect automatico dopo 2 secondi -->
  <meta http-equiv="refresh" content="2; url=https://discord.gg/p6S2aabXV">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0a0a0f, #1b1b29);
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
      text-align: center;
    }

    .container {
      padding-top: 80px;
    }

    .logo {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f7d75c;
      text-shadow: 0 0 10px rgba(247, 215, 92, 0.7);
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 20px;
      color: #cfcfcf;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #f7d75c;
      color: #1b1b29;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(247, 215, 92, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 14px rgba(247, 215, 92, 0.9);
    }

    .footer {
      margin-top: 60px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">HERO WARS ALLIANCE</div>
    <div class="subtitle">Stai per entrare nel nostro Discord…</div>

    <a class="btn" href="https://discord.gg/TUO_INVITO">

    </div>
  </div>

</html>
